# Quant Cloud: run on ARM64 to match the arm64 images the org builds.
x-quant-labels:
  quant.architecture: ARM64

services:
  drupal:
    image: ghcr.io/quantcdn-templates/app-drupal:latest
    build: .
    ports:
     - "80:80"
    volumes:
      - ./src/web/sites/default/files:/opt/drupal/web/sites/default/files
      - drupal_private:/opt/drupal/private
    # Database environment variables will be provided by Quant Cloud
    # For local development, use docker-compose.override.yml

  mysql:
    image: mysql:8.4
    volumes:
      - mysql_data:/var/lib/mysql
    labels:
      quant.type: mysql
    # Database configuration in docker-compose.override.yml

  redis:
    image: redis:alpine
    labels:
      quant.type: none  # Don't deploy to Quant Cloud

volumes:
  # On Quant Cloud every named volume is persistent storage shared by all tasks.
  drupal_private:
  mysql_data:
