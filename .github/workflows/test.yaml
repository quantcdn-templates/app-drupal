name: Test codebases

on:
  - push

permissions:
  contents: read

env:
  NODE_ENV: development

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-drupal:
    runs-on: ${{ contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && vars.QUANT_RUNS_ON_X64 && fromJSON(vars.QUANT_RUNS_ON_X64) || 'ubuntu-latest' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No third-party setup action (operator 2026-11-19): lint inside our own base image, the same PHP the
      # template ships. Runs as the runner user so vendor/ in the checkout stays writable.
      - name: Install project dependencies and validate code standards
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e COMPOSER_HOME=/tmp/composer \
            -v "$PWD/src:/app" -w /app --entrypoint sh ghcr.io/quantcdn-templates/app-apache-php:8.4 \
            -c 'composer install --dev --no-interaction && vendor/bin/phpcs --standard=phpcs.xml'
